# Model configuration for Qwen/Qwen3-VL-4B-Thinking

model_name: "Qwen/Qwen3-VL-4B-Thinking"

# vLLM serving config (references configs/eval/vllm/)
vllm_config: qwen_4b_thinking

# Evaluation config (references configs/eval/eval/)
eval_config: default

# Model-specific eval overrides (merged with eval config and global config)
# Qwen3-VL-4B-Thinking often needs higher max_tokens for reasoning
eval_overrides:
  # max_tokens: 32768  # Higher max tokens for thinking/reasoning
  # temperature: 1.0
  # num_samples: 1
  # max_concurrent: 256

